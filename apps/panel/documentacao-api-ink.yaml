  /v1/stores/external_orders:
    get:
      summary: Lista pedidos externos da loja
      tags:
        - Pedidos externos
      description: Retorna os pedidos externos (vendas feitas fora da INK e empurradas
        via API) da loja autenticada, com filtros server-side e paginação. Lojas
        sem pedidos externos recebem lista vazia. Requer o escopo
        `store.external_orders.read`. O filtro `payment_status` deriva do status
        do pedido (`refunded` equivale a `order_status=refunded`; `paid`, a
        qualquer outro status) — combiná-lo com um `order_status` contraditório
        retorna lista vazia.
      security:
        - bearer_auth: []
      parameters:
        - name: payment_status
          in: query
          required: false
          description: Filtro por status de pagamento
          schema:
            type: string
            enum:
              - paid
              - refunded
        - name: order_status
          in: query
          required: false
          description: Filtro por status do pedido
          schema:
            type: string
            enum:
              - waiting_payment
              - awaiting_analysis
              - payment_refused
              - expired
              - paid
              - refund_requested
              - refunded
              - canceled
              - waiting_approval
              - awaiting_stamp
              - awaiting_production
              - production_delayed
              - waiting_to_be_sent
              - waiting_to_be_collected
              - sent
              - preparing_for_delivery
              - delivery_in_progress
              - left_for_delivery
              - delivery_failure
              - delivery_interrupted
              - waiting_sender_action
              - return_started
              - returned
              - delivered
              - delivered_correios
        - name: begin_date
          in: query
          required: false
          description: "Data inicial para filtro por data de criação (formato: YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: "Data final para filtro por data de criação (formato: YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: is_exchange
          in: query
          required: false
          description: Filtro por pedidos de troca
          schema:
            type: boolean
        - name: external_order_id
          in: query
          required: false
          description: Filtra pelo id do pedido externo na INK
          schema:
            type: integer
        - name: api_order_id
          in: query
          required: false
          description: Filtra pelo id do pedido no sistema do integrador (match exato)
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: "Número da página (padrão: 1)"
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: "Registros por página (padrão: 5, máx: 100)"
          schema:
            type: integer
      responses:
        "200":
          description: pedidos externos retornados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                        payment_date:
                          type: string
                          format: date-time
                          nullable: true
                        rsv_factory_id:
                          type: string
                        api_order_id:
                          type: string
                        api_order_number:
                          type: string
                          nullable: true
                        origin:
                          type: string
                        order_status:
                          type: string
                        formatted_order_status:
                          type: string
                          nullable: true
                        payment_method:
                          type: string
                          nullable: true
                        payment_status:
                          type: string
                        is_exchange:
                          type: boolean
                        exchangeable:
                          type: boolean
                          description: Indica se o pedido aceita a criação de uma troca via POST
                            /v1/stores/exchanges. Antes da produção, ou — para
                            pedido já entregue — dentro de 30 dias da data de
                            entrega.
                        total_value:
                          type: string
                        refunded_amount:
                          type: string
                        shipping_value:
                          type: string
                        tracking_url:
                          type: string
                        delivery:
                          type: object
                          properties:
                            carrier:
                              type: string
                              nullable: true
                            delivery_method:
                              type: string
                              nullable: true
                            shipping_type:
                              type: string
                              nullable: true
                            current_status:
                              type: string
                              nullable: true
                            production_deadline:
                              type: string
                              format: date-time
                              nullable: true
                            production_lead_time_days:
                              type: integer
                              nullable: true
                            production_delayed:
                              type: boolean
                            estimated_delivery_date:
                              type: string
                              format: date-time
                              nullable: true
                            delivery_delayed:
                              type: boolean
                            delivered_at:
                              type: string
                              format: date-time
                              nullable: true
                            last_update_at:
                              type: string
                              format: date-time
                              nullable: true
                            delivery_date:
                              type: string
                              format: date-time
                              nullable: true
                            history:
                              type: array
                              items:
                                type: object
                                properties:
                                  event:
                                    type: string
                                    nullable: true
