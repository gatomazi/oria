    post:
      summary: Cria troca de pedido
      tags:
        - Trocas
      description: "Cria uma troca para um pedido (interno ou de integração) da loja
        autenticada. O pedido precisa estar elegível: antes de entrar em
        produção, ou — se já entregue — dentro de 30 dias da data de entrega.
        Consulte `exchangeable` na leitura do pedido para checar a elegibilidade
        antes de chamar este endpoint. Se a troca consome o direito de troca do
        cliente é decidido pela plataforma: troca antes da produção é de
        cortesia, troca de pedido já entregue consome. O resultado vem em
        `is_courtesy_exchange` na resposta. Motivos de troca por defeito (que
        exigem aprovação do suporte) exigem pelo menos uma foto em `photos`
        (`photo_url`, baixada com proteção contra SSRF, ou `photo_attachment` em
        base64 — mutuamente exclusivos por item; mesmo padrão usado em `POST
        /v1/stores/products`) e a descrição do problema em
        `problem_description`. Requer o escopo `store.exchanges.write`. O header
        `Idempotency-Key` é obrigatório: reenviar a mesma chave com o mesmo
        corpo retorna a resposta original em cache (inclusive 422) sem recriar a
        troca; a mesma chave com corpo diferente retorna 409."
      security:
        - bearer_auth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por operação; garante que retries não dupliquem a troca
          schema:
            type: string
      responses:
        "201":
          description: troca criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    type: object
                    properties:
                      id:
                        type: integer
                      exchange_type:
                        type: string
                        enum:
                          - platform
                          - integration
                        nullable: true
                      status:
                        type: string
                      is_courtesy_exchange:
                        type: boolean
                      exchange_reason:
                        type: string
                        nullable: true
                      exchange_reason_label:
                        type: string
                        nullable: true
                      original_exchange_reason:
                        type: string
                        nullable: true
                      original_exchange_reason_label:
                        type: string
                        nullable: true
                      problem_description:
                        type: string
                        nullable: true
                      support_review_status:
                        type: string
                        nullable: true
                      refusal_reason:
                        type: string
                        nullable: true
                      refusal_reason_code:
                        type: string
                        nullable: true
                      refusal_reason_label:
                        type: string
                        nullable: true
                      refusal_note:
                        type: string
                        nullable: true
                      reviewed_at:
                        type: string
                        nullable: true
                      old_order_returned_to_cd:
                        type: boolean
                        nullable: true
                      old_order:
                        type: object
                        nullable: true
                      new_order:
                        type: object
                        nullable: true
                      old_external_order:
                        type: object
                        nullable: true
                      new_external_order:
                        type: object
                        nullable: true
                required:
                  - exchange
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: token sem o escopo exigido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "422":
          description: erro de validação
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - error
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                original_order_id:
                  type: integer
                  description: ID numérico do pedido original (interno ou de integração),
                    pertencente à loja autenticada
                exchange_reason:
                  type: string
                  enum:
                    - larger_size
                    - smaller_size
                    - change_color
                    - change_print
                    - incorrect_print_position
                    - defect_in_product
                    - print_quality
                    - other
                problem_description:
                  type: string
                  maxLength: 1000
                  description: Descrição do problema informada pelo cliente. Obrigatória quando
                    exchange_reason exige aprovação do suporte
                    (defect_in_product, incorrect_print_position, print_quality)
                items:
                  type: array
                  description: Itens de reposição da troca
                  items:
                    type: object
                    properties:
                      old_item_id:
                        type: integer
                        description: ID do item do pedido original sendo substituído
                      product_v2_id:
                        type: integer
                      product_variant_id:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
                    required:
                      - old_item_id
                      - product_v2_id
                      - product_variant_id
                      - quantity
                photos:
                  type: array
                  description: Fotos do defeito, obrigatórias quando exchange_reason exige
                    aprovação do suporte (defect_in_product,
                    incorrect_print_position, print_quality)
                  items:
                    type: object
                    properties:
                      photo_url:
                        type: string
                        description: URL pública da foto (https, sem redirecionamento pra rede interna)
                      photo_attachment:
                        type: string
                        description: Foto em base64
              required:
                - original_order_id
                - exchange_reason
                - items
