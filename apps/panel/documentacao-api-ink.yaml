  /v1/stores/orders/{order_id}/refunds:
    parameters:
      - name: order_id
        in: path
        description: ID do pedido
        required: true
        schema:
          type: integer
    get:
      summary: Lista os reembolsos de um pedido
      tags:
        - Pedidos
      description: Retorna os reembolsos/chargebacks de um pedido da loja autenticada,
        com valores separados (INK/lojista), itens reembolsados e datas. Requer
        o escopo `store.refunds.read`.
      security:
        - bearer_auth: []
      responses:
        "200":
          description: reembolso parcial retornado com valores e itens
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        status:
                          type: string
                        reason:
                          type: string
                        reason_description:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        reviewed_at:
                          type: string
                          format: date-time
                          nullable: true
                        partial:
                          type: boolean
                        total_refund_amount:
                          type: string
                        total_ink_refund_amount:
                          type: string
                        total_seller_refund_amount:
                          type: string
                        refunded_items:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              requested_quantity:
                                type: integer
                              order_item:
                                type: object
                required:
                  - refunds
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
    post:
      summary: Efetua o reembolso parcial ou total de um pedido
      tags:
        - Pedidos
      description: "Reembolsa um pedido da loja autenticada: parcial
        (itens/quantidades) ou total, quando `refunded_items` cobre a quantidade
        integral de todos os itens. Requer o escopo `store.refunds.write` e o
        header `Idempotency-Key` (replays com a mesma chave e payload devolvem a
        resposta original sem reembolsar de novo)."
      security:
        - bearer_auth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave de idempotência única por operação (máx. 255 caracteres)
          schema:
            type: string
      responses:
        "200":
          description: reembolso parcial efetuado
        "401":
          description: não autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Motivo do reembolso — ver enum Chargeback::REASON/REASON_CANCEL
                refunded_items:
                  type: array
                  items:
                    type: object
                    properties:
                      order_item_id:
                        type: integer
                      requested_quantity:
                        type: integer
                    required:
                      - order_item_id
                      - requested_quantity
              required:
                - reason
                - refunded_items
  /v1/stores/orders:
    get:
      summary: Lista pedidos da loja
      tags:
        - Pedidos
      description: Retorna a lista de pedidos da loja autenticada com suporte a
        filtros e paginação. Requer o escopo `store.orders.read`.
      security:
        - bearer_auth: []
      parameters:
        - name: payment_status
          in: query
          required: false
          description: Filtro por status de pagamento
          schema:
            type: string
            enum:
              - pending
              - paid
              - succeeded
              - waiting_payment
              - awaiting_analysis
              - free
              - refund_requested
              - refunded
              - canceled
              - failed
              - expired
              - not_authorized
              - dispute
              - chargeback
        - name: order_status
          in: query
          required: false
          description: Filtro por status do pedido
          schema:
            type: string
            enum:
              - waiting_payment
              - awaiting_analysis
              - payment_refused
              - expired
              - paid
              - refund_requested
              - refunded
              - canceled
              - waiting_approval
              - awaiting_stamp
              - awaiting_production
              - production_delayed
              - waiting_to_be_sent
              - waiting_to_be_collected
              - sent
              - preparing_for_delivery
              - delivery_in_progress
              - left_for_delivery
              - delivery_failure
              - delivery_interrupted
              - waiting_sender_action
              - return_started
              - returned
              - delivered
              - delivered_correios
        - name: begin_date
          in: query
          required: false
          description: "Data inicial para filtro por data de criação (formato: YYYY-MM-DD;
            o dia inteiro é incluído)"
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: "Data final para filtro por data de criação (formato: YYYY-MM-DD; o
            dia inteiro é incluído)"
          schema:
            type: string
            format: date
        - name: is_exchange
          in: query
          required: false
          description: Filtro por pedidos de troca
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: "Número da página (padrão: 1)"
