  /v1/stores/shipping_simulation:
    get:
      summary: Simula o frete da loja para um CEP
      tags:
        - Frete
      description: Retorna as opções de entrega estimadas da loja autenticada para o
        CEP informado, com prazo em dias úteis e valor. A primeira opção da
        lista é a que o checkout destacaria. **Os valores podem sofrer alteração
        a qualquer momento.** **O valor é uma estimativa sobre um produto de
        referência (camiseta padrão), já que a simulação recebe apenas o CEP** —
        o campo `reference_product` declara o peso e as dimensões usados no
        cálculo. Para produtos de peso ou dimensão diferentes, o frete cobrado
        no checkout será outro. Um CEP válido sem cobertura retorna `200` com
        `delivery_options` vazio; indisponibilidade do provedor de frete retorna
        `502`. O resultado é cacheado por até 1 hora por loja e CEP (falhas e
        respostas vazias não entram em cache). Requer o escopo
        `store.shipping_simulation.read`.
      security:
        - bearer_auth: []
      parameters:
        - name: cep
          in: query
          required: true
          description: "CEP de destino. Aceito com ou sem hífen (ex: 22250-040 ou 22250040)"
          schema:
            type: string
            example: 22250-040
      responses:
        "200":
          description: simulação retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipping_simulation:
                    type: object
                    properties:
                      cep:
                        type: string
                      reference_product:
                        type: object
                        description: Produto de referência sobre o qual o frete foi calculado.
                        properties:
                          description:
                            type: string
                          weight:
                            type: number
                            description: Peso em quilogramas
                          width:
                            type: number
                            description: Largura em centímetros
                          height:
                            type: number
                            description: Altura em centímetros
                          length:
                            type: number
                            description: Comprimento em centímetros
                          quantity:
                            type: integer
                        required:
                          - description
                          - weight
                          - width
                          - height
                          - length
                          - quantity
                      delivery_options:
                        type: array
                        items:
                          type: object
                          properties:
                            delivery_method_id:
                              type: integer
                              nullable: true
                            name:
                              type: string
                              nullable: true
                            type:
                              type: string
                              nullable: true
                            provider:
                              type: string
                              nullable: true
                            description:
                              type: string
                              nullable: true
                            estimated_business_days:
                              type: integer
                              nullable: true
                            cost:
                              type: number
                              description: Valor estimado do frete, em reais. Pode sofrer alteração a qualquer
                                momento e é calculado sobre o produto de
                                referência (`reference_product`), não sobre um
                                produto específico da loja.
                          required:
                            - delivery_method_id
                            - name
                            - cost
                            - estimated_business_days
                    required:
                      - cep
                      - reference_product
                      - delivery_options
                required:
                  - shipping_simulation
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: acesso proibido — plano sem acesso à API externa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
        "404":
          description: loja não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "422":
          description: cep ausente ou malformado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - error
        "502":
          description: provedor de frete indisponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
  /v1/stores/withdraws:
    get:
      summary: Lista os saques da loja
      tags:
        - Financeiro
      description: Retorna o histórico de saques da loja autenticada, do mais recente
        para o mais antigo, com paginação e filtro por período. Somente saques
        com referência no provedor financeiro são listados. Somente leitura —
        criação de saque via API está fora de escopo. Requer o escopo
        `store.withdrawals.read`.
      security:
        - bearer_auth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Número da página para paginação (padrão: 1)"
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          description: "Quantidade de registros por página (padrão: 25, máximo: 100)"
          schema:
            type: integer
            default: 25
        - name: start_date
          in: query
          required: false
          description: "Data inicial do período (formato ISO 8601, ex: 2024-01-01)"
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: "Data final do período (formato ISO 8601, ex: 2024-01-31)"
          schema:
            type: string
            format: date
      responses:
        "200":
          description: saques retornados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  withdraws:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        amount:
                          type: number
                        created_at:
                          type: string
                          format: date-time
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_count:
                    type: integer
                required:
                  - withdraws
                  - page
                  - per_page
                  - total_pages
                  - total_count
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: acesso proibido — plano sem acesso à API externa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
        "404":
          description: loja não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "422":
          description: parâmetros inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - error
