        `arts` faz upsert por `base_image_id`: se a variante já existe a arte é
        trocada (e variantes desativadas daquela base voltam a ficar ativas); se
        não existe, uma nova variante é criada. `remove_variants` desativa as
        variantes dos `base_image_id` informados (não é permitido remover
        todas). Enviar arte nova ou trocada devolve o produto para curadoria:
        `approval_status` volta a `waiting` (ou `retrying`, se estava reprovado)
        e os mockups são regerados de forma assíncrona. A arte aceita `art_url`
        (https, baixada com proteção contra SSRF) ou `art_attachment` (base64) —
        mutuamente exclusivos por item. Apenas produtos sob demanda podem ser
        atualizados. Requer o escopo `store.products.write` e o header
        `Idempotency-Key`."
      security:
        - bearer_auth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por operação; garante que retries não dupliquem a
            atualização
          schema:
            type: string
      responses:
        "200":
          description: produto atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  product:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        nullable: true
                      slug:
                        type: string
                        nullable: true
                      description:
                        type: string
                        nullable: true
                      store_product_url:
                        type: string
                        nullable: true
                      visible_in_store:
                        type: boolean
                        nullable: true
                      customizable_by_buyer:
                        type: boolean
                        nullable: true
                      total_sales_count:
                        type: integer
                        nullable: true
                      product_cluster_id:
                        type: integer
                        nullable: true
                      price:
                        type: string
                        nullable: true
                      promotional_price:
                        type: string
                        nullable: true
                      tags:
                        type: array
                        items:
                          type: string
                      main_image_url:
                        type: string
                        nullable: true
                      approval_status:
                        type: string
                        nullable: true
                        enum:
                          - waiting
                          - approved
                          - disapproved
                          - retrying
                          - resizing
                          - null
                      status:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                      updated_at:
                        type: string
                        format: date-time
                        nullable: true
                      store:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          slug:
                            type: string
                      product_type:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                      product_variants:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            sku:
                              type: string
                              nullable: true
                            color:
                              type: string
                              nullable: true
                            hex_color:
                              type: string
                              nullable: true
                            size:
                              type: string
                              nullable: true
                            model:
                              type: string
                              nullable: true
                            is_available:
                              type: boolean
                              nullable: true
                            available_quantity:
                              type: integer
                              nullable: true
                            sales_count:
                              type: integer
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                              nullable: true
                required:
                  - status
                  - product
        "401":
          description: não autorizado
        "404":
          description: produto não pertence à loja
        "422":
          description: nenhum campo para atualizar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - status
                  - error
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: string
                  example: "129.90"
                visible_in_store:
                  type: boolean
                tags:
                  type: array
                  items:
                    type: string
                  description: Substitui todas as tags; [] limpa
                collections:
                  type: array
                  items:
                    type: integer
                  description: IDs de coleções existentes; substitui o conjunto atual; [] remove
                    de todas
                new_collections:
                  type: array
                  items:
                    type: string
                  description: Nomes de novas coleções
                remove_variants:
                  type: array
                  items:
                    type: integer
                  description: base_image_id das variantes a desativar
                arts:
                  type: array
                  items:
                    type: object
                    properties:
                      base_image_id:
                        type: integer
                      art_url:
                        type: string
                        description: URL https pública da arte
                      art_attachment:
                        type: string
                        description: Arte em base64 (mutuamente exclusivo com art_url)
                    required:
                      - base_image_id
