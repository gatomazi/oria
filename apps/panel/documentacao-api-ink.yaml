openapi: 3.0.1
info:
  title: INK API
  version: v1
paths:
  /v1/stores/abandoned_carts:
    get:
      summary: Lista os carrinhos abandonados da loja
      tags:
        - Carrinhos Abandonados
      description: Retorna os carrinhos abandonados da loja autenticada (com itens e
        sem atualização há mais de 30 minutos), do mais recente para o mais
        antigo, com paginação e filtros por data de criação/atualização e por
        contato permitido (`contactable`). Disponível apenas para planos que
        incluem o recurso de carrinhos abandonados. Requer o escopo
        `store.abandoned_carts.read`.
      security:
        - bearer_auth: []
      parameters:
        - name: created_begin_date
          in: query
          required: false
          description: "Data inicial de criação (formato ISO 8601, ex: 2024-01-01)"
          schema:
            type: string
            format: date
        - name: created_end_date
          in: query
          required: false
          description: "Data final de criação (formato ISO 8601, ex: 2024-01-31)"
          schema:
            type: string
            format: date
        - name: updated_begin_date
          in: query
          required: false
          description: "Data inicial de atualização (formato ISO 8601, ex: 2024-01-01)"
          schema:
            type: string
            format: date
        - name: updated_end_date
          in: query
          required: false
          description: "Data final de atualização (formato ISO 8601, ex: 2024-01-31)"
          schema:
            type: string
            format: date
        - name: contactable
          in: query
          required: false
          description: Filtra por carrinhos cujo comprador aceitou contato de marketing e
            tem email ou telefone
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: "Número da página para paginação (padrão: 1)"
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          description: "Quantidade de registros por página (padrão: 20, máximo: 100)"
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: carrinhos abandonados retornados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  abandoned_carts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        uuid:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        items_count:
                          type: integer
                        buyer:
                          type: object
                          nullable: true
                          properties:
                            type:
                              type: string
                            name:
                              type: string
                              nullable: true
                            email:
                              type: string
                              nullable: true
                            phone:
                              type: string
                              nullable: true
                            marketing:
                              type: boolean
                        contactable:
                          type: boolean
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              product_variant_id:
                                type: integer
                                nullable: true
                              sku:
                                type: string
                                nullable: true
                              quantity:
                                type: integer
                              free_quantity:
                                type: integer
                              unit_price:
                                type: number
                              total_price:
                                type: number
                              mockup_image_url:
                                type: string
                                nullable: true
                              product_v2:
                                type: object
                                nullable: true
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                                    nullable: true
                                  slug:
                                    type: string
                                    nullable: true
                                  store_product_url:
                                    type: string
                                    nullable: true
                                  price:
                                    type: string
                                    nullable: true
                                  promotional_price:
                                    type: string
                                    nullable: true
                                  main_image_url:
                                    type: string
                                    nullable: true
                                  status:
                                    type: string
                                    nullable: true
                              product_variant:
                                type: object
                                nullable: true
                                properties:
                                  id:
                                    type: integer
                                  sku:
                                    type: string
                                    nullable: true
                                  color:
                                    type: string
                                    nullable: true
                                  hex_color:
                                    type: string
                                    nullable: true
                                  size:
                                    type: string
                                    nullable: true
                                  model:
                                    type: string
                                    nullable: true
                                  is_available:
                                    type: boolean
                                    nullable: true
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_count:
                    type: integer
                required:
                  - abandoned_carts
                  - page
                  - per_page
                  - total_pages
                  - total_count
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: plano sem o recurso de carrinhos abandonados
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "404":
          description: loja não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "422":
          description: parâmetros inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - error
  /v1/stores/balance_extract:
    get:
      summary: Consulta o extrato financeiro da loja
      tags:
        - Financeiro
      description: Retorna o extrato financeiro da loja autenticada, agrupado por dia,
        com paginação e filtro por período. Loja sem conta de pagamento ativa
        retorna extrato vazio. Requer o escopo `store.financial_statement.read`.
      security:
        - bearer_auth: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Número da página para paginação (padrão: 1)"
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          description: "Quantidade de registros por página (padrão: 25, máximo: 100)"
          schema:
            type: integer
            default: 25
        - name: start_date
          in: query
          required: false
          description: "Data inicial do período (formato ISO 8601, ex: 2024-01-01)"
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: "Data final do período (formato ISO 8601, ex: 2024-01-31)"
          schema:
            type: string
            format: date
      responses:
        "200":
          description: extrato retornado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance_extract:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        balance:
                          type: number
                        movements:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              amount:
                                type: number
                              description:
                                type: string
                                nullable: true
                              date:
                                type: string
                                format: date-time
                                nullable: true
                              order_id:
                                type: integer
                                nullable: true
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_count:
                    type: integer
                  has_more:
                    type: boolean
                required:
                  - balance_extract
                  - page
                  - per_page
                  - total_pages
                  - total_count
                  - has_more
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: acesso proibido — plano sem acesso à API externa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
        "404":
          description: loja não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "422":
          description: parâmetros inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - error
        "502":
          description: provedor financeiro indisponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
  /v1/stores/balance:
    get:
      summary: Consulta o saldo financeiro da loja
      tags:
        - Financeiro
      description: Retorna o saldo disponível e pendente da loja autenticada,
        consultado no provedor financeiro. O saldo é cacheado por até 60
        segundos — consultas dentro desse intervalo não refletem movimentações
        mais recentes. Loja sem conta de pagamento ativa retorna saldo zerado.
        Requer o escopo `store.financial_balance.read`.
      security:
        - bearer_auth: []
      responses:
        "200":
          description: saldo retornado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    properties:
                      available:
                        type: number
                      pending:
                        type: number
                    required:
                      - available
                      - pending
                required:
                  - balance
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: acesso proibido — plano sem acesso à API externa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
        "404":
          description: loja não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "502":
          description: provedor financeiro indisponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
  /v1/stores/collections/{collection_id}/custom_showcase:
    parameters:
      - name: collection_id
        in: path
        description: ID da categoria
        required: true
        schema:
          type: integer
    get:
      summary: Exibe a vitrine customizada de uma categoria
      tags:
        - Categorias
      description: 'Retorna a configuração atual da vitrine customizada
        (ordem/destaque de produtos e kits) de uma categoria (collection) da
        loja autenticada. Sem configuração prévia, retorna o estado default
        (`sequence_type: "sales"`, listas vazias). Requer o escopo
        `store.categories.read`.'
      security:
        - bearer_auth: []
      responses:
        "200":
          description: vitrine personalizada configurada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  custom_showcase:
                    type: object
                    properties:
                      sequence_type:
                        type: string
                      product_items:
                        type: array
                        items:
                          type: object
                          properties:
                            product_id:
                              type: integer
                            position:
                              type: integer
                          required:
                            - product_id
                            - position
                      kit_items:
                        type: array
                        items:
                          type: object
                          properties:
                            kit_id:
                              type: integer
                            position:
                              type: integer
                          required:
                            - kit_id
                            - position
                    required:
                      - sequence_type
                      - product_items
                      - kit_items
                required:
                  - status
                  - custom_showcase
        "404":
          description: categoria não pertence à loja
    put:
      summary: Atualiza a vitrine customizada de uma categoria
      tags:
        - Categorias
      description: Substitui totalmente a configuração da vitrine customizada de uma
        categoria. As posições de `product_items` e `kit_items` formam uma única
        sequência combinada, contígua e sem repetição (1 a N). Enviar
        `sequence_type` diferente de `personalized` junto com itens não vazios
        retorna erro de validação. Cada `product_id`/`kit_id` deve pertencer à
        própria categoria; produtos removidos e kits não publicados são
        rejeitados. Requer o escopo `store.categories.write` e o header
        `Idempotency-Key`.
      security:
        - bearer_auth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave de idempotência única por operação (máx. 255 caracteres)
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: vitrine reordenada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  custom_showcase:
                    type: object
                    properties:
                      sequence_type:
                        type: string
                      product_items:
                        type: array
                        items:
                          type: object
                          properties:
                            product_id:
                              type: integer
                            position:
                              type: integer
                          required:
                            - product_id
                            - position
                      kit_items:
                        type: array
                        items:
                          type: object
                          properties:
                            kit_id:
                              type: integer
                            position:
                              type: integer
                          required:
                            - kit_id
                            - position
                    required:
                      - sequence_type
                      - product_items
                      - kit_items
                required:
                  - status
                  - custom_showcase
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sequence_type:
                  type: string
                  enum:
                    - personalized
                    - sales
                    - recent
                product_items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      position:
                        type: integer
                kit_items:
                  type: array
                  items:
                    type: object
                    properties:
                      kit_id:
                        type: integer
                      position:
                        type: integer
              required:
                - sequence_type
  /v1/stores/collections:
    get:
      summary: Lista categorias da loja
      tags:
        - Categorias
      description: Retorna as categorias (collections) da loja autenticada, ordenadas
        pela posição no navbar, com suporte a filtros e paginação. Requer o
        escopo `store.categories.read`.
      security:
        - bearer_auth: []
      parameters:
        - name: name
          in: query
          required: false
          description: Filtro por nome (busca parcial, sem diferenciar maiúsculas)
          schema:
            type: string
        - name: is_available
          in: query
          required: false
          description: Filtro por disponibilidade na loja (sem o filtro, retorna todas)
          schema:
            type: boolean
        - name: begin_date
          in: query
          required: false
          description: "Data inicial de criação para filtro (formato: YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          description: "Data final de criação para filtro (formato: YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          description: "Número da página (padrão: 1)"
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: "Registros por página (padrão: 5, máximo: 100)"
          schema:
            type: integer
      responses:
        "200":
          description: categorias com filtros aplicados
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        slug:
                          type: string
                        description:
                          type: string
                          nullable: true
                        is_available:
                          type: boolean
                          nullable: true
                        position:
                          type: integer
                        product_ids:
                          type: array
                          items:
                            type: integer
                        kit_ids:
                          type: array
                          items:
                            type: integer
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_count:
                    type: integer
                required:
                  - collections
                  - page
                  - per_page
                  - total_pages
                  - total_count
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: acesso proibido — plano sem acesso à API externa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
        "404":
          description: loja não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
        "422":
          description: erro de validação
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - status
                  - error
                  - errors
    post:
      summary: Cria uma categoria na loja
      tags:
        - Categorias
      description: Cria uma categoria (collection) na loja autenticada, com produtos e
        kits associados por id (máximo de 100 ids por lista, semântica de
        substituição total) e posição no navbar. Requer o escopo
        `store.categories.write` e o header `Idempotency-Key` (replays com a
        mesma chave e payload devolvem a resposta original sem criar de novo). O
        recurso `collections` corresponde ao escopo `store.categories.*`.
      security:
        - bearer_auth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave de idempotência única por operação (máx. 255 caracteres)
          schema:
            type: string
            maxLength: 255
      responses:
        "201":
          description: categoria criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  collection:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      description:
                        type: string
                        nullable: true
                      is_available:
                        type: boolean
                        nullable: true
                      position:
                        type: integer
                      product_ids:
                        type: array
                        items:
                          type: integer
                      kit_ids:
                        type: array
                        items:
                          type: integer
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                required:
                  - status
                  - collection
        "400":
          description: header Idempotency-Key ausente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                  - error
                  - code
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: token sem o escopo de escrita
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "422":
          description: erro de validação — nome duplicado na loja
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - status
                  - error
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 20
                description:
                  type: string
                is_available:
                  type: boolean
                position:
                  type: integer
                  minimum: 1
                product_ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 100
                kit_ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 100
              required:
                - name
  /v1/stores/collections/{id}:
    parameters:
      - name: id
        in: path
        description: ID da categoria
        required: true
        schema:
          type: integer
    get:
      summary: Exibe detalhes de uma categoria
      tags:
        - Categorias
      description: Retorna os detalhes de uma categoria (collection) da loja
        autenticada, incluindo os produtos e kits associados. Requer o escopo
        `store.categories.read`.
      security:
        - bearer_auth: []
      responses:
        "200":
          description: categoria encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  collection:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      description:
                        type: string
                        nullable: true
                      is_available:
                        type: boolean
                        nullable: true
                      position:
                        type: integer
                      product_ids:
                        type: array
                        items:
                          type: integer
                      kit_ids:
                        type: array
                        items:
                          type: integer
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                required:
                  - status
                  - collection
        "401":
          description: não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "403":
          description: acesso proibido — plano sem acesso à API externa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
        "404":
          description: categoria não encontrada
    patch:
      summary: Atualiza uma categoria da loja
      tags:
        - Categorias
      description: Atualiza parcialmente uma categoria (collection) da loja
        autenticada. Chaves omitidas ficam intocadas; `product_ids`/`kit_ids`
        presentes substituem totalmente as associações (lista vazia remove
        todas; máximo de 100 ids). `position` move a categoria no navbar. Requer
        o escopo `store.categories.write` e o header `Idempotency-Key`.
      security:
        - bearer_auth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave de idempotência única por operação (máx. 255 caracteres)
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: categoria atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
