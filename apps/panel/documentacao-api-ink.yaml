  /v1/stores/products/{product_id}/copy:
    post:
      summary: Copia produto para outro tipo de produto via API externa
      tags:
        - Produtos
      description: "Copia a estampa de um produto (products_v2) para outro tipo de
        produto, reaproveitando o mesmo fluxo de cópia individual do painel. O
        tipo de destino (`product_type_id`) deve ser diferente do tipo do
        produto de origem, sob demanda e disponível para a loja; a estampa
        precisa existir nas cores disponíveis do tipo de destino e produtos
        reprovados não podem ser copiados. `price` é opcional: sem ele a cópia
        usa o preço padrão da loja para o tipo de destino ou o preço sugerido do
        plano. `include_categories` (padrão `true`) replica os vínculos de
        categoria do produto original. A cópia nasce sem imagem principal e com
        `approval_status=waiting` (ou `resizing`, quando a grade de impressão do
        tipo de destino é diferente); os mockups são gerados de forma assíncrona
        — consulte o GET para acompanhar. Efeito colateral: a cópia entra no
        agrupamento (`product_cluster_id`) do produto original (criado
        automaticamente se não existir) e substitui no grupo um eventual produto
        que já ocupava o tipo de destino. Requer o escopo `store.products.write`
        e o header `Idempotency-Key`."
      security:
        - bearer_auth: []
      parameters:
        - name: product_id
          in: path
          required: true
          description: ID do produto de origem
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por operação; garante que retries não dupliquem a cópia
          schema:
            type: string
      responses:
        "201":
          description: produto copiado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  product:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        nullable: true
                      slug:
                        type: string
                        nullable: true
                      description:
                        type: string
                        nullable: true
                      store_product_url:
                        type: string
                        nullable: true
                      visible_in_store:
                        type: boolean
                        nullable: true
                      customizable_by_buyer:
                        type: boolean
                        nullable: true
                      total_sales_count:
                        type: integer
                        nullable: true
                      product_cluster_id:
                        type: integer
                        nullable: true
                      price:
                        type: string
                        nullable: true
                      promotional_price:
                        type: string
                        nullable: true
                      tags:
                        type: array
                        items:
                          type: string
                      main_image_url:
                        type: string
                        nullable: true
                      approval_status:
                        type: string
                        nullable: true
                        enum:
                          - waiting
                          - approved
                          - disapproved
                          - retrying
                          - resizing
                          - null
                      status:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                      updated_at:
                        type: string
                        format: date-time
                        nullable: true
                      store:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          slug:
                            type: string
                      product_type:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                      product_variants:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            sku:
                              type: string
                              nullable: true
                            color:
                              type: string
                              nullable: true
                            hex_color:
                              type: string
                              nullable: true
                            size:
                              type: string
                              nullable: true
                            model:
                              type: string
                              nullable: true
                            is_available:
                              type: boolean
                              nullable: true
                            available_quantity:
                              type: integer
                              nullable: true
                            sales_count:
                              type: integer
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                              nullable: true
                required:
                  - status
                  - product
        "401":
          description: não autorizado
        "404":
          description: produto não pertence à loja
          content:
