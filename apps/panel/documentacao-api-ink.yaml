  /v1/stores/product_clusters/{product_cluster_id}/products/{id}:
    delete:
      summary: Remove produto de um agrupamento via API externa
      tags:
        - Produtos
      description: 'Remove um produto do agrupamento de estampa (o "desagrupar" do
        painel). O produto removido volta a ficar sem agrupamento
        (`product_cluster_id: null` no GET de produtos). Se o produto removido
        era o de vitrine, outro produto do grupo assume como
        `default_product_id` (escolha automática) e a vitrine personalizada da
        loja é atualizada. **Atenção:** agrupamento que fica com menos de 2
        produtos é dissolvido — remover o penúltimo produto destrói o grupo
        inteiro e a resposta volta com `product_cluster: null`; o último produto
        também fica solto. Requer o escopo `store.products.write` e o header
        `Idempotency-Key`.'
      security:
        - bearer_auth: []
      parameters:
        - name: product_cluster_id
          in: path
          required: true
          description: ID do agrupamento
          schema:
            type: integer
        - name: id
          in: path
          required: true
          description: ID do produto a remover do agrupamento
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por operação; garante que retries não repitam a remoção
          schema:
            type: string
      responses:
        "200":
          description: produto removido do agrupamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  product_cluster:
                    type: object
                    nullable: true
                    description: Agrupamento atualizado; null quando o grupo foi dissolvido (ficou
                      com menos de 2 produtos)
                    properties:
                      id:
                        type: integer
                      default_product_id:
                        type: integer
                      product_ids:
                        type: array
                        items:
                          type: integer
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                      updated_at:
                        type: string
                        format: date-time
                        nullable: true
                    required:
                      - id
                      - default_product_id
                      - product_ids
                required:
                  - status
        "401":
          description: não autorizado
        "404":
          description: produto não pertence ao agrupamento
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
  /v1/stores/product_clusters:
    get:
      summary: Lista agrupamentos da loja
      tags:
        - Produtos
      description: Retorna os agrupamentos de estampa (product_clusters) da loja
        autenticada, com o produto de vitrine (`default_product_id`) e os
        produtos de cada grupo (`product_ids`). Aceita filtro por `product_id`
        para descobrir o agrupamento de um produto específico. Suporta
        paginação. Requer o escopo `store.products.read`.
      security:
        - bearer_auth: []
      parameters:
        - name: product_id
          in: query
          required: false
          description: Filtra pelo agrupamento que contém este produto
          schema:
            type: integer
        - name: page
          in: query
          required: false
          description: "Número da página (padrão: 1)"
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          description: "Registros por página (padrão: 20, máx: 100)"
          schema:
            type: integer
      responses:
        "200":
          description: agrupamentos retornados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_clusters:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        default_product_id:
                          type: integer
                        product_ids:
                          type: array
                          items:
                            type: integer
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                        updated_at:
                          type: string
                          format: date-time
                          nullable: true
                      required:
                        - id
                        - default_product_id
                        - product_ids
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_count:
                    type: integer
                required:
                  - product_clusters
                  - page
                  - per_page
                  - total_pages
                  - total_count
        "401":
          description: não autorizado
    post:
      summary: Agrupa produtos via API externa
      tags:
        - Produtos
      description: 'Agrupa produtos da loja num cluster de estampa (mesma estampa
        aplicada em tipos de produto diferentes) — o mesmo "Agrupar estampas" do
        painel. Na vitrine, o agrupamento aparece como um card único (o produto
        de vitrine, `default_product_id`) e o comprador alterna entre os tipos
        na página do produto. Regras: só um produto por tipo de produto dentro
        do grupo; produtos precisam estar aprovados ou em curadoria
        (`waiting`/`resizing`); um produto não pode pertencer a outro
        agrupamento. Se algum dos `product_ids` já estiver num agrupamento, os
        demais são adicionados a esse agrupamento existente (merge) — por isso a
        criação exige ao menos 2 produtos, mas o merge aceita 1 produto novo
        acompanhado de 1 já agrupado. O campo `product_cluster_id` dos produtos
        (GET de produtos) reflete o agrupamento. Requer o escopo
        `store.products.write` e o header `Idempotency-Key`.'
      security:
        - bearer_auth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por operação; garante que retries não dupliquem o
            agrupamento
          schema:
            type: string
      responses:
        "201":
          description: produtos agrupados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  product_cluster:
                    type: object
                    properties:
                      id:
                        type: integer
                      default_product_id:
                        type: integer
                      product_ids:
                        type: array
                        items:
                          type: integer
                      created_at:
                        type: string
                        format: date-time
                        nullable: true
                      updated_at:
                        type: string
                        format: date-time
                        nullable: true
                    required:
                      - id
                      - default_product_id
                      - product_ids
                required:
                  - status
                  - product_cluster
        "401":
          description: não autorizado
        "422":
          description: produtos com o mesmo tipo no agrupamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: string
                required:
                  - status
                  - error
                  - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs dos produtos da loja a agrupar (mínimo 2, ou 1 novo + 1 já
                    agrupado)
              required:
                - product_ids
