<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #1a1208;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 80% 20%, rgba(160,120,80,0.18) 0%, transparent 65%),
      radial-gradient(ellipse 60% 40% at 20% 85%, rgba(214,186,141,0.10) 0%, transparent 60%);
  }

  .inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 0 80px; width: 100%;
  }

  .label {
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: #a07850; margin-bottom: 60px;
  }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 86px;
    line-height: 1.0; color: #faf4ec;
    letter-spacing: -0.02em; margin-bottom: 80px;
  }

  .title em { font-style: italic; color: #c8a06a; }

  /* mockup do celular */
  .phone {
    width: 460px;
    background: #0e1009;
    border-radius: 52px;
    border: 2px solid rgba(255,255,255,0.08);
    box-shadow: 0 40px 120px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
    overflow: hidden;
    padding: 48px 36px 52px;
  }

  .phone-top {
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.35); text-align: center;
    margin-bottom: 52px;
  }

  .phone-hero {
    font-family: 'Fraunces', serif;
    font-style: italic; font-size: 28px;
    color: #c8a06a; text-align: center;
    margin-bottom: 10px;
  }

  .phone-title {
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 62px;
    line-height: 1.0; color: #faf4ec;
    text-align: center; letter-spacing: -0.02em;
    margin-bottom: 48px;
  }

  .phone-title em { font-style: italic; color: #c8a06a; }

  .phone-input {
    background: rgba(245,240,232,0.95);
    border-radius: 18px;
    padding: 24px 28px;
    display: flex; align-items: center;
    gap: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    margin-bottom: 16px;
  }

  .input-text {
    font-size: 26px; font-weight: 600;
    color: #1a1a14; flex: 1;
  }

  .input-cursor {
    width: 3px; height: 28px;
    background: #6b4f35;
    border-radius: 2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .suggestion {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }

  .sug-item {
    display: flex; align-items: center;
    gap: 20px; padding: 22px 24px;
    border-bottom: 1px solid #f0ece6;
  }

  .sug-item:last-child { border-bottom: none; }

  .sug-pin {
    width: 40px; height: 40px;
    border-radius: 50%; background: #f0ece6;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .sug-info { flex: 1; }
  .sug-city { font-size: 24px; font-weight: 600; color: #1a1a14; }
  .sug-brand { font-size: 18px; color: #6b6b58; margin-top: 2px; }

  .sug-state {
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.06em;
    background: #6b4f35; color: white;
    border-radius: 6px; padding: 5px 14px;
  }

  .brand-tag {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center; font-size: 20px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="inner">
    <span class="label">Use Centro</span>
    <h2 class="title">Digite<br/>sua <em>cidade</em></h2>

    <div class="phone">
      <div class="phone-top">Orgulho Regional</div>
      <p class="phone-hero">Qual é a</p>
      <h3 class="phone-title">sua <em>cidade?</em></h3>

      <div class="phone-input">
        <span class="input-text">Curitiba</span>
        <div class="input-cursor"></div>
      </div>

      <div class="suggestion">
        <div class="sug-item">
          <div class="sug-pin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b4f35" stroke-width="2.5" stroke-linecap="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div class="sug-info">
            <div class="sug-city">Curitiba</div>
            <div class="sug-brand">Use Centro</div>
          </div>
          <span class="sug-state">PR</span>
        </div>
        <div class="sug-item" style="opacity:0.45">
          <div class="sug-pin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b4f35" stroke-width="2.5" stroke-linecap="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div class="sug-info">
            <div class="sug-city">Curitibanos</div>
            <div class="sug-brand">Use Centro</div>
          </div>
          <span class="sug-state">SC</span>
        </div>
      </div>
    </div>
  </div>
  <div class="brand-tag">@usecentro.oficial</div>
</body>
</html>
