<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #1a1208;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 20%, rgba(160,120,80,0.22) 0%, transparent 65%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(214,186,141,0.12) 0%, transparent 60%);
    pointer-events: none;
  }

  .grid {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 59px, rgba(160,120,80,0.04) 60px
    );
  }

  .inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 0 100px;
  }

  .eyebrow {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: #a07850; margin-bottom: 56px;
  }

  .question {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 148px;
    line-height: 0.95;
    color: #faf4ec;
    letter-spacing: -0.03em;
    margin-bottom: 64px;
  }

  .question em { font-style: italic; color: #c8a06a; }

  .sub {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 38px;
    color: rgba(214,186,141,0.7);
    line-height: 1.5;
  }

  .dot {
    width: 10px; height: 10px;
    background: #a07850;
    border-radius: 50%;
    margin: 80px auto 0;
    opacity: 0.5;
  }

  .brand-tag {
    position: absolute;
    bottom: 100px; left: 0; right: 0;
    text-align: center;
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="grid"></div>
  <div class="inner">
    <span class="eyebrow">Use Centro</span>
    <h1 class="question">Sua cidade<br/>tem<br/><em>camiseta?</em></h1>
    <p class="sub">Descubra agora.</p>
    <div class="dot"></div>
  </div>
  <div class="brand-tag">@usecentro.oficial</div>
</body>
</html>
