<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #1a1e14;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(138,158,110,0.2) 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 20% 90%, rgba(214,186,141,0.10) 0%, transparent 55%);
  }

  .inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 0 100px;
  }

  .label {
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: #8a9e6e; margin-bottom: 64px;
  }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 128px;
    line-height: 0.95; color: #f5f0e8;
    letter-spacing: -0.03em; margin-bottom: 48px;
  }

  .title em { font-style: italic; color: #d6ba8d; }

  .sub {
    font-family: 'Fraunces', serif;
    font-style: italic; font-size: 40px;
    color: rgba(214,186,141,0.65);
    margin-bottom: 96px; line-height: 1.4;
  }

  .url-box {
    background: rgba(77,84,61,0.35);
    border: 1.5px solid rgba(138,158,110,0.4);
    border-radius: 24px;
    padding: 36px 72px;
    margin-bottom: 56px;
  }

  .url-text {
    font-size: 44px; font-weight: 700;
    color: #d6ba8d; letter-spacing: 0.02em;
  }

  .swipe {
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
  }

  .swipe-text {
    font-size: 24px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(245,240,232,0.4);
  }

  .swipe-arrow {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }

  .arrow-line {
    width: 2px; height: 48px;
    background: linear-gradient(to bottom, transparent, rgba(214,186,141,0.5));
    border-radius: 2px;
  }

  .arrow-tip {
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid rgba(214,186,141,0.5);
  }

  .brand-tag {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center; font-size: 20px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="inner">
    <span class="label">Use Sul</span>
    <h2 class="title">Vista o<br/><em>seu</em><br/>lugar.</h2>
    <p class="sub">Acesse e encontre<br/>a camiseta da sua cidade.</p>

    <div class="url-box">
      <span class="url-text">orgulhoregional.com.br</span>
    </div>

    <div class="swipe">
      <span class="swipe-text">link nos destaques</span>
      <div class="swipe-arrow">
        <div class="arrow-line"></div>
        <div class="arrow-tip"></div>
      </div>
    </div>
  </div>
  <div class="brand-tag">@usesul.oficial</div>
</body>
</html>
