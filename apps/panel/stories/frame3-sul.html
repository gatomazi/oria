<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #1a1e14;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 30%, rgba(138,158,110,0.15) 0%, transparent 65%);
  }

  .inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 0 100px; width: 100%;
  }

  .label {
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: #8a9e6e; margin-bottom: 56px;
  }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 900; font-size: 96px;
    line-height: 1.0; color: #f5f0e8;
    letter-spacing: -0.02em; margin-bottom: 100px;
  }

  .title em { font-style: italic; color: #d6ba8d; }

  .steps { display: flex; flex-direction: column; gap: 0; width: 100%; }

  .step {
    display: flex; align-items: center;
    gap: 48px; padding: 52px 0;
    border-bottom: 1px solid rgba(138,158,110,0.15);
    text-align: left;
  }

  .step:last-child { border-bottom: none; }

  .step-num {
    font-family: 'Fraunces', serif;
    font-weight: 900; font-style: italic;
    font-size: 96px; line-height: 1;
    color: rgba(214,186,141,0.25);
    flex-shrink: 0; width: 80px;
    text-align: center;
  }

  .step-content {}

  .step-title {
    font-size: 42px; font-weight: 700;
    color: #f5f0e8; margin-bottom: 10px;
    line-height: 1.1;
  }

  .step-desc {
    font-size: 28px; font-weight: 400;
    color: rgba(245,240,232,0.5);
    line-height: 1.4;
  }

  .brand-tag {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center; font-size: 20px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="inner">
    <span class="label">Use Sul</span>
    <h2 class="title">Como<br/><em>usar</em></h2>

    <div class="steps">
      <div class="step">
        <span class="step-num">1</span>
        <div class="step-content">
          <div class="step-title">Acesse o site</div>
          <div class="step-desc">orgulhoregional.com.br</div>
        </div>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <div class="step-content">
          <div class="step-title">Digite sua cidade</div>
          <div class="step-desc">Veja o preview da camiseta na hora</div>
        </div>
      </div>
      <div class="step">
        <span class="step-num">3</span>
        <div class="step-content">
          <div class="step-title">Clique e compre</div>
          <div class="step-desc">Use <strong style="color:#d6ba8d">PRIMEIRACOMPRA</strong> e ganhe 10% off</div>
        </div>
      </div>
    </div>
  </div>
  <div class="brand-tag">@usesul.oficial</div>
</body>
</html>
