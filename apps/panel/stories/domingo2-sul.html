<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1080"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #1a1e14;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  /* noise */
  body::after {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none; z-index: 10; opacity: 0.45;
  }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 75% 55% at 50% 42%, rgba(138,158,110,0.2) 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 10% 88%, rgba(214,186,141,0.1) 0%, transparent 55%);
  }

  /* mockup desfocado ao fundo */
  .phone-bg {
    position: absolute;
    width: 520px; height: 780px;
    background: #0e1009;
    border-radius: 60px;
    border: 2px solid rgba(255,255,255,0.06);
    bottom: 180px; left: 50%;
    transform: translateX(-50%) rotate(-6deg);
    opacity: 0.18;
    filter: blur(8px);
    z-index: 1;
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; padding: 60px 40px;
    gap: 32px;
  }
  .pb-bar { width: 100%; height: 12px; background: rgba(245,240,232,0.15); border-radius: 6px; }
  .pb-bar.short { width: 60%; }
  .pb-input { width: 100%; height: 56px; background: rgba(245,240,232,0.2); border-radius: 16px; }
  .pb-card { width: 100%; height: 80px; background: rgba(255,255,255,0.08); border-radius: 16px; }

  .inner {
    position: relative; z-index: 2;
    padding: 0 110px;
    text-align: center;
    width: 100%;
    display: flex; flex-direction: column;
    align-items: center;
  }

  .eyebrow {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: #8a9e6e; margin-bottom: 64px;
  }

  .title {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 122px;
    line-height: 1.0;
    color: #f5f0e8;
    letter-spacing: -0.03em;
    margin-bottom: 40px;
  }
  .title em { font-style: italic; color: #d6ba8d; }

  .sub {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 42px;
    color: rgba(214,186,141,0.6);
    margin-bottom: 40px;
  }

  /* estados */
  .states {
    display: flex; gap: 20px;
    margin-bottom: 88px;
  }
  .state-tag {
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.1em;
    color: rgba(138,158,110,0.7);
    padding: 8px 20px;
    border: 1px solid rgba(138,158,110,0.2);
    border-radius: 100px;
  }

  /* url com glow */
  .cta {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(77,84,61,0.4);
    border: 1.5px solid rgba(138,158,110,0.35);
    border-radius: 100px;
    padding: 30px 60px;
    box-shadow:
      0 0 40px rgba(138,158,110,0.15),
      0 0 80px rgba(138,158,110,0.08),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .cta-text {
    font-size: 32px; font-weight: 700;
    letter-spacing: 0.03em;
    color: #d6ba8d;
  }

  .brand-tag {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center;
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.22);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <!-- mockup desfocado -->
  <div class="phone-bg">
    <div class="pb-bar short"></div>
    <div class="pb-bar" style="width:45%"></div>
    <div class="pb-input"></div>
    <div class="pb-card"></div>
    <div class="pb-card" style="opacity:0.6"></div>
  </div>

  <div class="inner">
    <span class="eyebrow">Use Sul</span>
    <h1 class="title">Sua cidade<br/>tem<br/><em>camiseta.</em></h1>
    <p class="sub">Vai lá conferir.</p>

    <div class="states">
      <span class="state-tag">PR</span>
      <span class="state-tag">SC</span>
      <span class="state-tag">RS</span>
    </div>

    <!-- espaço para sticker de link do Instagram -->
    <div style="width:100%;height:140px;border-radius:24px;border:2px dashed rgba(138,158,110,0.2);display:flex;align-items:center;justify-content:center;">
      <span style="font-size:22px;font-weight:600;letter-spacing:0.08em;color:rgba(138,158,110,0.3);">STICKER AQUI</span>
    </div>
  </div>

  <div class="brand-tag">@usesul.oficial</div>
</body>
</html>
