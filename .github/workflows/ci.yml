name: CI

# Monorepo Oria: um job por componente, mais os contratos cross-service.
#
# Regra herdada do painel: teste pulado é verde na saída do CI, e isso é exatamente o modo de falha
# que a productização combate. Por isso o Postgres é efêmero, as migrations rodam do zero e nenhum
# passo aceita "não rodou" como sucesso.
#
# Os contratos de rollout que rodam o código REAL de commits antigos são autocontidos: os snapshots
# podados daqueles commits estão versionados em `apps/panel/test/fixtures/legacy/`. Nenhum job
# depende de repositório vizinho, caminho absoluto ou interpretador local.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contratos cross-service e autocontenção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-contracts.mjs
      # Falha se voltar a existir caminho absoluto de máquina ou dependência de repo vizinho.
      - run: npm run repo:self-check

  panel:
    name: painel (Node)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: oria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # scripts/test-db.mjs usa TEST_DATABASE_URL e pula o Docker quando ela existe.
      TEST_DATABASE_URL: postgres://postgres:teste@127.0.0.1:5432/oria_test
      WHATSAPP_GO_DIR: ${{ github.workspace }}/services/whatsapp
    defaults:
      run:
        working-directory: apps/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/whatsapp/go.sum

      - run: npm ci --ignore-scripts

      - name: migrations do zero
        run: npm run migrate:up
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: migrations são idempotentes
        run: npm run migrate:up
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: suíte do painel
        run: npm test

      - name: suíte sob a role da aplicação (oria_app)
        run: npm run test:app-role
        env:
          TEST_APP_ROLE: '1'

      - name: build do SPA do painel (dist/)
        run: npm run build

  platform-admin:
    name: control plane (Oria Admin)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: oria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Mesmo contrato do job do painel: com TEST_DATABASE_URL, o test-db.mjs do control plane
      # aplica as migrations do PAINEL nesse banco e não sobe container próprio.
      TEST_DATABASE_URL: postgres://postgres:teste@127.0.0.1:5432/oria_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O schema do control plane mora nas migrations do painel, e é o node-pg-migrate instalado
      # lá que as aplica — por isso as dependências do painel entram neste job também.
      - run: npm ci --ignore-scripts
        working-directory: apps/panel
      - run: npm ci --ignore-scripts
        working-directory: apps/platform-admin

      - name: suíte do control plane
        run: npm test
        working-directory: apps/platform-admin

      - name: controles negativos do control plane
        run: npm run test:negative
        working-directory: apps/platform-admin

  creatives:
    name: gerador de criativos (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/creative-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: run_tests.py
        run: python run_tests.py

  whatsapp:
    name: serviço de whatsapp (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEBHOOK_TEST_DATABASE_URL: postgres://postgres:teste@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: services/whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/whatsapp/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
